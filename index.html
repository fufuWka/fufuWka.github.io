<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Содержимое ff.s</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            padding: 40px 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            color: #58a6ff;
            font-size: 24px;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #30363d;
        }
        pre {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 20px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            font-size: 14px;
            color: #e6edf3;
        }
        .loading { color: #8b949e; }
        .error {
            background: #3d0d0d;
            color: #f85149;
            padding: 16px;
            border-radius: 6px;
            border: 1px solid #f85149;
        }
        .hint {
            margin-top: 20px;
            font-size: 12px;
            color: #8b949e;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📄 ff.s</h1>
        <div id="content"><p class="loading">Загрузка...</p></div>
        <p class="hint">Если файл не загружается, проверьте, что <code>ff.s</code> есть в репозитории и замените URL в скрипте.</p>
    </div>

    <script>
        (function() {
            const loc = window.location.href;
            let rawUrl = '';

            // Автоопределение для GitHub Pages: username.github.io/repo/
            const match = loc.match(/https?:\/\/([^.]+)\.github\.io\/([^/]+)/);
            if (match) {
                const user = match[1];
                const repo = match[2];
                rawUrl = `https://raw.githubusercontent.com/${user}/${repo}/main/ff.s`;
            } else {
                // ⬇️ ЗАМЕНИТЕ на свой raw URL, если автоопределение не сработало
                rawUrl = 'https://raw.githubusercontent.com/ВАШ_НИК/ВАШ_РЕПО/main/ff.s';
            }

            fetch(rawUrl)
                .then(r => {
                    if (!r.ok) throw new Error('Файл не найден (HTTP ' + r.status + ')');
                    return r.text();
                })
                .then(text => {
                    const pre = document.createElement('pre');
                    pre.textContent = text;
                    const box = document.getElementById('content');
                    box.innerHTML = '';
                    box.appendChild(pre);
                })
                .catch(err => {
                    document.getElementById('content').innerHTML = 
                        '<div class="error">❌ ' + err.message + '</div>';
                });
        })();
    </script>
</body>
</html>
